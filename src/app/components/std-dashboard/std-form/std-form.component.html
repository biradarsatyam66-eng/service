<div class="card">
    <div class="card-header">
        <h2 class="m-0"><strong>{{isineditmode?'UPDATE STD':'ADD STD'}}</strong></h2>
    </div>
    <div class="card-body">
        <form #stdform="ngForm" (ngSubmit)="onAddStd()">
            <div class="form-group">
                <label for="fname">FIRST NAME:-</label>
                <input 
                required
                ngModel
                name="fname"
                type="text" class="form-control">
            </div>

            <div class="form-group">
                <label for="lname">LAST NAME:-</label>
                <input 
                required
                ngModel
                name="lname"
                type="text" class="form-control">
            </div>

            <div class="form-group">
                <label for="email">EMAIL:-</label>
                <input 
                required
                ngModel
                name="email"
                type="text" class="form-control">
            </div>

            <div class="form-group">
                <label for="contact">CONTACT:-</label>
                <input 
                required
                ngModel
                name="contact"
                type="number" class="form-control">
            </div>
            <p *ngIf="isinvalid && stdform.invalid">
                <strong class="text-danger">PLEASE ENTER VALID DETAILS !!!</strong>
            </p>

            <div>
                <button 
                *ngIf="!isineditmode"
                mat-raised-button color="primary" class="btn-block">ADD STD</button>

                <button 
                *ngIf="isineditmode"
                mat-raised-button color="accent" class="btn-block">UPDATE STD</button>
            </div>
        </form>
    </div>
</div>

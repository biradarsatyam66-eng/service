<div class="card">
    <div class="card-body">
        <form #postform="ngForm" (ngSubmit)="onpostAdd()">
            <div class="form-group">
                <label for="title">Title:-</label>
                <input 
                ngModel
                name="title"
                type="text" class="form-control">
            </div>

            <div class="form-group">
                <label for="body">Body:-</label>
                <textarea 
                ngModel
                name="body" rows="5" class="form-control"></textarea>
            </div>

            <div class="form-group">
                <label for="userId">User Id:-</label>
                <select 
                ngModel
                name="userId"
                class="form-control">
                    <option [ngValue]="1">1</option>
                    <option [ngValue]="2">2</option>
                    <option [ngValue]="3">3</option>
                    <option [ngValue]="4">4</option>
                    <option [ngValue]="5">5</option>
                    <option [ngValue]="6">6</option>
                    <option [ngValue]="7">7</option>
                    <option [ngValue]="8">8</option>
                    <option [ngValue]="9">9</option>
                    <option [ngValue]="10">10</option>
                </select>
            </div>

            <div>
                <button 
                *ngIf="!isineditmode"
                mat-raised-button color="primary" class="btn-block">ADD POST</button>

                <button
                (click)="onupdate()" 
                *ngIf="isineditmode"
                mat-raised-button color="accent" type="button" class="btn-block">UPDATE POST</button>
            </div>
        </form>
    </div>
</div>
